# =============================================================================
# TMUX Configuration - Tokyo Night Theme
# =============================================================================

# -----------------------------------------------------------------------------
# Terminal Settings
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-features ',xterm-256color:hyperlinks'
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# Mouse & Clipboard
# -----------------------------------------------------------------------------
set -g mouse on
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Window & Pane Indexing
# -----------------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# -----------------------------------------------------------------------------
# Terminal Title (shows in Ghostty title bar)
# -----------------------------------------------------------------------------
set-option -g set-titles on
set-option -g set-titles-string "#S  #{b:pane_current_path}"

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrow keys (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt+H/L to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# -----------------------------------------------------------------------------
# Splits (at current path)
# -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Copy Mode (vi-style)
# -----------------------------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Utility Bindings
# -----------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind e run-shell "nvim ~/.config/tmux/tmux.conf"

# -----------------------------------------------------------------------------
# Worktree parking (wt-park / wt-cleanup)
# -----------------------------------------------------------------------------
# prefix P : park current window into its own session (blank prompt = branch name)
bind P command-prompt -p "Park as (blank = branch):" "run-shell '/Users/alex/.local/bin/wt-park \"%%\"'"
# prefix X : remove this worktree + kill this parked session (post-merge cleanup)
bind X confirm-before -p "Cleanup worktree at #{pane_current_path} + kill session? (y/n)" "run-shell '/Users/alex/.local/bin/wt-cleanup --force'"

# -----------------------------------------------------------------------------
# Mobile-friendly actions menu (Termius / SSH on phone)
# -----------------------------------------------------------------------------
# prefix m -> a tappable menu of common actions, so you never need chords.
# With mouse on, TAP an item; otherwise use arrows + Enter, or press its letter.
# Tip: in Termius, add an accessory key that sends "C-Space m" for one-tap access.
# A two-finger tap / long-press on the status bar opens it too (no prefix needed).
bind m display-menu -T "#[align=centre] tmux actions " -x C -y C \
  "Copy pane id (for Claude)" i { run-shell "printf '%s' '#{pane_id}' | pbcopy" ; display-message "Copied pane id — paste to Claude" } \
  "" \
  "Park window for review"  p { run-shell "/Users/alex/.local/bin/wt-park" } \
  "Cleanup worktree + kill" k { confirm-before -p "Cleanup worktree + kill session? (y/n)" "run-shell '/Users/alex/.local/bin/wt-cleanup --force'" } \
  "" \
  "Go to session"           g { choose-tree -Zs } \
  "Go to window"            w { choose-tree -Zw } \
  "New window here"         c { new-window -c "#{pane_current_path}" } \
  "Next window"             n { next-window } \
  "Previous window"         b { previous-window } \
  "" \
  "Save layout (resurrect)" s { run-shell "/Users/alex/.config/tmux/plugins/tmux-resurrect/scripts/save.sh" } \
  "Restore layout"          t { run-shell "/Users/alex/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh" } \
  "" \
  "Reload config"           R { source-file ~/.config/tmux/tmux.conf } \
  "Detach"                  d { detach-client }

# No-prefix open: two-finger tap / long-press (right-click) on the status bar.
bind -n MouseDown3Status  { display-menu -T "#[align=centre] tmux actions " -x M -y S \
  "Copy pane id (for Claude)" i { run-shell "printf '%s' '#{pane_id}' | pbcopy" ; display-message "Copied pane id — paste to Claude" } \
  "Park window for review"  p { run-shell "/Users/alex/.local/bin/wt-park" } \
  "Cleanup worktree + kill" k { confirm-before -p "Cleanup worktree + kill session? (y/n)" "run-shell '/Users/alex/.local/bin/wt-cleanup --force'" } \
  "Go to session"           g { choose-tree -Zs } \
  "Go to window"            w { choose-tree -Zw } \
  "New window here"         c { new-window -c "#{pane_current_path}" } \
  "Save layout"             s { run-shell "/Users/alex/.config/tmux/plugins/tmux-resurrect/scripts/save.sh" } \
  "Restore layout"          t { run-shell "/Users/alex/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh" } \
  "Detach"                  d { detach-client } }

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Session persistence: survive server crashes + reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Auto-save the environment every 15 min and auto-restore on server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Save pane contents and working dirs so restores land back in the right worktree
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.tmux/resurrect'


# -----------------------------------------------------------------------------
# Tokyo Night Theme - Riced Status Line
# -----------------------------------------------------------------------------
# Tokyo Night palette
# bg: #1a1b26 | fg: #c0caf5 | blue: #7aa2f7 | green: #9ece6a
# red: #f7768e | yellow: #e0af68 | magenta: #bb9af7 | cyan: #7dcfff
# dark: #15161e | comment: #565f89 | selection: #283457
# Powerline glyphs:  (e0b0)  (e0b2)  (e0b1)  (e0b3)

# Status bar position and general styling
set -g status-position top
set -g status-justify left
set-option -g status-style bg=default
set -g status-interval 3

# Status bar length
set -g status-left-length 100
set -g status-right-length 200

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Left: Session indicator with powerline pill
# └─────────────────────────────────────────────────────────────────────────────
set -g status-left "\
#[fg=#1a1b26,bg=#7aa2f7,bold]   #S #[fg=#7aa2f7,bg=default] "

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Right: Dev context - Languages, Git, Docker, K8s (like Starship)
# └─────────────────────────────────────────────────────────────────────────────
# Nerd Font Icons:  (node)  (python)  (rust)  (go)  (ruby)  (lua)
#                   (docker) 󱃾 (k8s)  (git)  (pkg)  (java)  (swift)
# Separators: │ (box drawing) or  (powerline thin)
set -g status-right "\
#[fg=#565f89,bg=default]\
#(cd #{pane_current_path}; [ -f docker-compose.yml ] || [ -f Dockerfile ] && echo '#[fg=#7dcfff] ')\
#(kubectl config current-context 2>/dev/null | grep -q . && echo '#[fg=#7aa2f7]󱃾 ')\
#(cd #{pane_current_path}; [ -f go.mod ] && echo '#[fg=#7dcfff] ')\
#(cd #{pane_current_path}; [ -f Cargo.toml ] && echo '#[fg=#f7768e] ')\
#(cd #{pane_current_path}; [ -f package.json ] && echo '#[fg=#9ece6a] ')\
#(cd #{pane_current_path}; [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ] && echo '#[fg=#e0af68] ')\
#(cd #{pane_current_path}; [ -f Gemfile ] && echo '#[fg=#f7768e] ')\
#(cd #{pane_current_path}; ls *.lua 2>/dev/null | grep -q . && echo '#[fg=#7aa2f7] ')\
#(cd #{pane_current_path}; [ -f Package.swift ] && echo '#[fg=#f7768e] ')\
#[fg=#3b4261]│ \
#[fg=#283457,bg=default]#[fg=#9ece6a,bg=#283457]  #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-')\
#[fg=#e0af68]#(cd #{pane_current_path}; git status --porcelain 2>/dev/null | grep -q . && echo '')\
#[fg=#bb9af7]#(cd #{pane_current_path}; git stash list 2>/dev/null | grep -q . && echo '')\
#[fg=#7aa2f7]#(cd #{pane_current_path}; git rev-list --count @{upstream}..HEAD 2>/dev/null | grep -v '^0$' | sed 's/^/⇡/')\
#[fg=#f7768e]#(cd #{pane_current_path}; git rev-list --count HEAD..@{upstream} 2>/dev/null | grep -v '^0$' | sed 's/^/⇣/') \
#[fg=#283457,bg=default]"

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Window Status: Minimal pills with index + name
# └─────────────────────────────────────────────────────────────────────────────
# Inactive windows - subtle pill shape (index + command:directory)
set -g window-status-format "\
#[fg=#3b4261,bg=default]#[fg=#565f89,bg=#3b4261] #I  #W:#[fg=#414868]#{b:pane_current_path} #[fg=#3b4261,bg=default]"

# Active window - bright accent pill (index + command:directory)
set -g window-status-current-format "\
#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #I  #W:#[fg=#283457]#{b:pane_current_path} #[fg=#7aa2f7,bg=default]"

# Separator between windows (small gap)
set -g window-status-separator " "

# Default window status style (transparent)
set-option -g window-status-style bg=default
set-option -g window-status-current-style bg=default

# Activity and bell styling
set-option -g window-status-activity-style bg=default,fg=#e0af68
set-option -g window-status-bell-style bg=default,fg=#f7768e

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Pane Borders - Subtle with active highlight
# └─────────────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#283457"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines "heavy"

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Message & Mode Styling
# └─────────────────────────────────────────────────────────────────────────────
set -g message-style "bg=#283457,fg=#c0caf5,bold"
set -g message-command-style "bg=#283457,fg=#c0caf5"
set -g mode-style "bg=#283457,fg=#c0caf5"

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Clock Mode
# └─────────────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

# -----------------------------------------------------------------------------
# Initialize TPM (keep at bottom)
# -----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
