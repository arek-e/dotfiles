# =============================================================================
# TMUX Configuration - Tokyo Night Theme
# =============================================================================

# -----------------------------------------------------------------------------
# Terminal Settings
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# Mouse & Clipboard
# -----------------------------------------------------------------------------
set -g mouse on
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Window & Pane Indexing
# -----------------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrow keys (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt+H/L to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# -----------------------------------------------------------------------------
# Splits (at current path)
# -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Copy Mode (vi-style)
# -----------------------------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Utility Bindings
# -----------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind e run-shell "nvim ~/.config/tmux/tmux.conf"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# -----------------------------------------------------------------------------
# Tokyo Night Theme - Riced Status Line
# -----------------------------------------------------------------------------
# Tokyo Night palette
# bg: #1a1b26 | fg: #c0caf5 | blue: #7aa2f7 | green: #9ece6a
# red: #f7768e | yellow: #e0af68 | magenta: #bb9af7 | cyan: #7dcfff
# dark: #15161e | comment: #565f89 | selection: #283457

# Status bar position and general styling
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-interval 1

# Status bar length
set -g status-left-length 100
set -g status-right-length 100

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Left: Session with powerline flow
# └─────────────────────────────────────────────────────────────────────────────
# Flow: [blue: session] → [dark: separator]
set -g status-left "\
#[bg=#7aa2f7,fg=#15161e,bold]  #S \
#[bg=#1a1b26,fg=#7aa2f7]\
#[fg=#565f89]  "

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Right: Directory, Date, Time with icons
# └─────────────────────────────────────────────────────────────────────────────
# Flow: [directory] ← [date] ← [time: magenta]
set -g status-right "\
#[fg=#565f89]  #{b:pane_current_path} \
#[fg=#283457]│\
#[fg=#7dcfff]   %d %b \
#[fg=#283457]│\
#[fg=#1a1b26,bg=#1a1b26]#[fg=#bb9af7,bg=#1a1b26]\
#[fg=#15161e,bg=#bb9af7,bold]  %H:%M "

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Window Status: Clean minimal with activity glow
# └─────────────────────────────────────────────────────────────────────────────
# Inactive windows - muted
set -g window-status-format "\
#[fg=#565f89,bg=#1a1b26] #I  #W "

# Active window - bright with indicator
set -g window-status-current-format "\
#[fg=#1a1b26,bg=#283457]\
#[fg=#7aa2f7,bg=#283457,bold] #I  #W \
#[fg=#283457,bg=#1a1b26]"

# Separator between windows
set -g window-status-separator ""

# Activity and bell styling
set -g window-status-activity-style "fg=#e0af68,bg=#1a1b26"
set -g window-status-bell-style "fg=#f7768e,bg=#1a1b26,bold"

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Pane Borders - Subtle with active highlight
# └─────────────────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#283457"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines "heavy"

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Message & Mode Styling
# └─────────────────────────────────────────────────────────────────────────────
set -g message-style "bg=#283457,fg=#c0caf5,bold"
set -g message-command-style "bg=#283457,fg=#c0caf5"
set -g mode-style "bg=#283457,fg=#c0caf5"

# ┌─────────────────────────────────────────────────────────────────────────────
# │ Clock Mode
# └─────────────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

# -----------------------------------------------------------------------------
# Initialize TPM (keep at bottom)
# -----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
