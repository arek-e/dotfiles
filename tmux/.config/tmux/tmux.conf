# =============================================================================
# TMUX Configuration - Catppuccin Theme
# =============================================================================

# -----------------------------------------------------------------------------
# Terminal Settings
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# Mouse & Clipboard
# -----------------------------------------------------------------------------
set -g mouse on
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Window & Pane Indexing
# -----------------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrow keys (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt+H/L to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# -----------------------------------------------------------------------------
# Splits (at current path)
# -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Copy Mode (vi-style)
# -----------------------------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Utility Bindings
# -----------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind e run-shell "nvim ~/.config/tmux/tmux.conf"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# -----------------------------------------------------------------------------
# Catppuccin Theme Configuration
# -----------------------------------------------------------------------------
set -g @catppuccin_flavor "mocha"

# Window styling
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Status bar position and styling
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Minimal left side: session name only
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"

# Status modules (minimal)
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "directory date_time"

# Directory module
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Date/time (minimal)
set -g @catppuccin_date_time_text "%H:%M"

# Pane borders
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_lavender}"

# -----------------------------------------------------------------------------
# Initialize TPM (keep at bottom)
# -----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
