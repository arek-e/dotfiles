# =============================================================================
# TMUX Configuration - Catppuccin Theme
# =============================================================================

# -----------------------------------------------------------------------------
# Terminal Settings
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# Mouse & Clipboard
# -----------------------------------------------------------------------------
set -g mouse on
set -g set-clipboard on

# -----------------------------------------------------------------------------
# Window & Pane Indexing
# -----------------------------------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-arrow keys (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt+H/L to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# -----------------------------------------------------------------------------
# Splits (at current path)
# -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Copy Mode (vi-style)
# -----------------------------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Utility Bindings
# -----------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind e run-shell "nvim ~/.config/tmux/tmux.conf"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'odedlaz/tmux-onedark-theme'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# -----------------------------------------------------------------------------
# One Dark Theme Configuration
# -----------------------------------------------------------------------------
# Status bar position and styling
set -g status-position bottom
set -g status-justify left

# One Dark theme options
set -g @onedark_widgets "#{b:pane_current_path}"
set -g @onedark_time_format "%H:%M"
set -g @onedark_date_format "%d/%m"

# Pane borders - One Dark colors
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"

# -----------------------------------------------------------------------------
# Initialize TPM (keep at bottom)
# -----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
