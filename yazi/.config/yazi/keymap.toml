# Yazi Keymap Configuration
# ==========================
# Vim-style keybindings

[manager]
keymap = [
  # Navigation
  { on = "k", run = "arrow -1", desc = "Move cursor up" },
  { on = "j", run = "arrow 1", desc = "Move cursor down" },
  { on = "K", run = "arrow -5", desc = "Move cursor up 5 lines" },
  { on = "J", run = "arrow 5", desc = "Move cursor down 5 lines" },
  { on = "<C-u>", run = "arrow -50%", desc = "Move cursor up half page" },
  { on = "<C-d>", run = "arrow 50%", desc = "Move cursor down half page" },
  { on = "<C-b>", run = "arrow -100%", desc = "Move cursor up full page" },
  { on = "<C-f>", run = "arrow 100%", desc = "Move cursor down full page" },

  { on = "h", run = "leave", desc = "Go to parent directory" },
  { on = "l", run = "enter", desc = "Enter the directory" },
  { on = "<Enter>", run = "enter", desc = "Enter the directory" },
  { on = "<Backspace>", run = "leave", desc = "Go to parent directory" },

  # Go to specific directories
  { on = ["g", "h"], run = "cd ~", desc = "Go to home" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "Go to config" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "Go to downloads" },
  { on = ["g", "p"], run = "cd ~/projects", desc = "Go to projects" },
  { on = ["g", "t"], run = "cd /tmp", desc = "Go to temp" },
  { on = ["g", "/"], run = "cd /", desc = "Go to root" },

  # First/last
  { on = "g", run = "arrow -99999999", desc = "Move cursor to top" },
  { on = "G", run = "arrow 99999999", desc = "Move cursor to bottom" },

  # Selection
  { on = "<Space>", run = ["select --state=none", "arrow 1"], desc = "Toggle selection" },
  { on = "v", run = "visual_mode", desc = "Enter visual mode" },
  { on = "V", run = "visual_mode --unset", desc = "Enter visual mode (unset)" },
  { on = "<C-a>", run = "select_all --state=true", desc = "Select all files" },
  { on = "<C-r>", run = "select_all --state=none", desc = "Invert selection" },

  # Operations
  { on = "o", run = "open", desc = "Open file" },
  { on = "O", run = "open --interactive", desc = "Open file interactively" },
  { on = "y", run = "yank", desc = "Yank (copy) selected files" },
  { on = "x", run = "yank --cut", desc = "Yank (cut) selected files" },
  { on = "p", run = "paste", desc = "Paste yanked files" },
  { on = "P", run = "paste --force", desc = "Paste yanked files (force overwrite)" },
  { on = "-", run = "link", desc = "Create symlink (absolute)" },
  { on = "_", run = "link --relative", desc = "Create symlink (relative)" },
  { on = "d", run = "remove", desc = "Move to trash" },
  { on = "D", run = "remove --permanently", desc = "Delete permanently" },
  { on = "a", run = "create", desc = "Create file/directory" },
  { on = "r", run = "rename --cursor=before_ext", desc = "Rename file" },
  { on = ";", run = "shell", desc = "Run shell command" },
  { on = ":", run = "shell --block", desc = "Run shell command (block)" },
  { on = ".", run = "hidden toggle", desc = "Toggle hidden files" },
  { on = "s", run = "search fd", desc = "Search with fd" },
  { on = "S", run = "search rg", desc = "Search with ripgrep" },
  { on = "<C-s>", run = "search none", desc = "Cancel search" },
  { on = "z", run = "plugin zoxide", desc = "Jump with zoxide" },
  { on = "Z", run = "plugin fzf", desc = "Jump with fzf" },

  # Copy paths
  { on = ["c", "c"], run = "copy path", desc = "Copy file path" },
  { on = ["c", "d"], run = "copy dirname", desc = "Copy directory path" },
  { on = ["c", "f"], run = "copy filename", desc = "Copy filename" },
  { on = ["c", "n"], run = "copy name_without_ext", desc = "Copy filename without ext" },

  # Filter
  { on = "f", run = "filter --smart", desc = "Filter files" },

  # Find
  { on = "/", run = "find --smart", desc = "Find next" },
  { on = "?", run = "find --smart --previous", desc = "Find previous" },
  { on = "n", run = "find_arrow", desc = "Go to next found" },
  { on = "N", run = "find_arrow --previous", desc = "Go to previous found" },

  # Sort
  { on = ["<", "m"], run = "sort modified --dir-first", desc = "Sort by modified" },
  { on = ["<", "M"], run = "sort modified --dir-first --reverse", desc = "Sort by modified (reverse)" },
  { on = ["<", "c"], run = "sort created --dir-first", desc = "Sort by created" },
  { on = ["<", "C"], run = "sort created --dir-first --reverse", desc = "Sort by created (reverse)" },
  { on = ["<", "e"], run = "sort extension --dir-first", desc = "Sort by extension" },
  { on = ["<", "E"], run = "sort extension --dir-first --reverse", desc = "Sort by extension (reverse)" },
  { on = ["<", "a"], run = "sort alphabetical --dir-first", desc = "Sort alphabetically" },
  { on = ["<", "A"], run = "sort alphabetical --dir-first --reverse", desc = "Sort alphabetically (reverse)" },
  { on = ["<", "n"], run = "sort natural --dir-first", desc = "Sort naturally" },
  { on = ["<", "N"], run = "sort natural --dir-first --reverse", desc = "Sort naturally (reverse)" },
  { on = ["<", "s"], run = "sort size --dir-first", desc = "Sort by size" },
  { on = ["<", "S"], run = "sort size --dir-first --reverse", desc = "Sort by size (reverse)" },

  # Tabs
  { on = "t", run = "tab_create --current", desc = "Create new tab" },
  { on = "1", run = "tab_switch 0", desc = "Switch to tab 1" },
  { on = "2", run = "tab_switch 1", desc = "Switch to tab 2" },
  { on = "3", run = "tab_switch 2", desc = "Switch to tab 3" },
  { on = "4", run = "tab_switch 3", desc = "Switch to tab 4" },
  { on = "[", run = "tab_switch -1 --relative", desc = "Switch to previous tab" },
  { on = "]", run = "tab_switch 1 --relative", desc = "Switch to next tab" },
  { on = "{", run = "tab_swap -1", desc = "Swap with previous tab" },
  { on = "}", run = "tab_swap 1", desc = "Swap with next tab" },

  # Tasks
  { on = "w", run = "tasks_show", desc = "Show tasks" },

  # Help
  { on = "~", run = "help", desc = "Show help" },
  { on = "<F1>", run = "help", desc = "Show help" },

  # Quit
  { on = "q", run = "quit", desc = "Quit" },
  { on = "Q", run = "quit --no-cwd-file", desc = "Quit without changing cwd" },
  { on = "<Esc>", run = "escape", desc = "Cancel/Escape" },
]

[tasks]
keymap = [
  { on = "<Esc>", run = "close", desc = "Close task manager" },
  { on = "q", run = "close", desc = "Close task manager" },
  { on = "w", run = "close", desc = "Close task manager" },

  { on = "k", run = "arrow -1", desc = "Move cursor up" },
  { on = "j", run = "arrow 1", desc = "Move cursor down" },

  { on = "<Enter>", run = "inspect", desc = "Inspect task" },
  { on = "x", run = "cancel", desc = "Cancel task" },
]

[select]
keymap = [
  { on = "<Esc>", run = "close", desc = "Cancel" },
  { on = "q", run = "close", desc = "Cancel" },
  { on = "<C-c>", run = "close", desc = "Cancel" },

  { on = "k", run = "arrow -1", desc = "Move cursor up" },
  { on = "j", run = "arrow 1", desc = "Move cursor down" },

  { on = "<Enter>", run = "close --submit", desc = "Confirm" },
]

[input]
keymap = [
  { on = "<Esc>", run = "close", desc = "Cancel" },
  { on = "<C-c>", run = "close", desc = "Cancel" },
  { on = "<Enter>", run = "close --submit", desc = "Confirm" },

  # Cursor movement
  { on = "<Left>", run = "move -1", desc = "Move cursor left" },
  { on = "<Right>", run = "move 1", desc = "Move cursor right" },
  { on = "<Home>", run = "move -999", desc = "Move cursor to start" },
  { on = "<End>", run = "move 999", desc = "Move cursor to end" },
  { on = "<C-a>", run = "move -999", desc = "Move cursor to start" },
  { on = "<C-e>", run = "move 999", desc = "Move cursor to end" },
  { on = "<C-b>", run = "move -1", desc = "Move cursor left" },
  { on = "<C-f>", run = "move 1", desc = "Move cursor right" },

  # Deletion
  { on = "<Backspace>", run = "backspace", desc = "Delete previous character" },
  { on = "<Delete>", run = "backspace --under", desc = "Delete character under cursor" },
  { on = "<C-h>", run = "backspace", desc = "Delete previous character" },
  { on = "<C-d>", run = "backspace --under", desc = "Delete character under cursor" },
  { on = "<C-u>", run = "kill bol", desc = "Delete to start of line" },
  { on = "<C-k>", run = "kill eol", desc = "Delete to end of line" },
  { on = "<C-w>", run = "kill backward", desc = "Delete previous word" },

  # Undo/redo
  { on = "<C-z>", run = "undo", desc = "Undo" },
  { on = "<C-y>", run = "redo", desc = "Redo" },
]

[completion]
keymap = [
  { on = "<C-c>", run = "close", desc = "Cancel" },
  { on = "<Tab>", run = "close --submit", desc = "Confirm" },
  { on = "<Enter>", run = ["close --submit", "close_input --submit"], desc = "Confirm and close input" },

  { on = "<C-p>", run = "arrow -1", desc = "Move cursor up" },
  { on = "<C-n>", run = "arrow 1", desc = "Move cursor down" },
  { on = "<Up>", run = "arrow -1", desc = "Move cursor up" },
  { on = "<Down>", run = "arrow 1", desc = "Move cursor down" },
]

[help]
keymap = [
  { on = "<Esc>", run = "escape", desc = "Clear/Cancel" },
  { on = "q", run = "close", desc = "Close" },
  { on = "<C-c>", run = "close", desc = "Close" },

  { on = "k", run = "arrow -1", desc = "Move cursor up" },
  { on = "j", run = "arrow 1", desc = "Move cursor down" },
  { on = "<Up>", run = "arrow -1", desc = "Move cursor up" },
  { on = "<Down>", run = "arrow 1", desc = "Move cursor down" },

  { on = "/", run = "filter", desc = "Filter" },
]
