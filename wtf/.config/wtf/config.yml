wtf:
  colors:
    background: "transparent"
    border:
      focusable: "#7aa2f7"
      focused: "#bb9af7"
      normal: "#3b4261"
    checked: "#9ece6a"
    highlight:
      fore: "#1a1b26"
      back: "#7aa2f7"
    text: "#c0caf5"
    title: "#7dcfff"
  grid:
    columns: [40, 40, 40]
    rows: [12, 12, 6]
  refreshInterval: 30s
  openFileUtil: "open"
  term: "xterm-256color"

mods:
  # ===========================================
  # GitHub - Your Open PRs
  # ===========================================
  github_prs:
    type: cmdrunner
    enabled: true
    position:
      top: 0
      left: 0
      height: 1
      width: 1
    refreshInterval: 5m
    title: " My PRs"
    cmd: "gh"
    args: ["pr", "list", "--author", "@me", "--state", "open", "--limit", "8"]

  # ===========================================
  # GitHub - Issues Created by You
  # ===========================================
  github_issues_created:
    type: cmdrunner
    enabled: true
    position:
      top: 0
      left: 1
      height: 1
      width: 1
    refreshInterval: 5m
    title: " Issues I Created"
    cmd: "gh"
    args: ["issue", "list", "--author", "@me", "--state", "open", "--limit", "8"]

  # ===========================================
  # GitHub - Issues Assigned to You
  # ===========================================
  github_issues_assigned:
    type: cmdrunner
    enabled: true
    position:
      top: 0
      left: 2
      height: 1
      width: 1
    refreshInterval: 5m
    title: " Issues Assigned"
    cmd: "gh"
    args: ["issue", "list", "--assignee", "@me", "--state", "open", "--limit", "8"]

  # ===========================================
  # Linear - Your Tasks
  # ===========================================
  linear_tasks:
    type: cmdrunner
    enabled: true
    position:
      top: 1
      left: 0
      height: 1
      width: 2
    refreshInterval: 5m
    title: " Linear Issues"
    cmd: "npx"
    args: ["@schpet/linear-cli", "list", "--limit", "10"]

  # ===========================================
  # PRs to Review
  # ===========================================
  github_prs_review:
    type: cmdrunner
    enabled: true
    position:
      top: 1
      left: 2
      height: 1
      width: 1
    refreshInterval: 5m
    title: " PRs to Review"
    cmd: "gh"
    args: ["pr", "list", "--search", "is:open review-requested:@me", "--limit", "8"]

  # ===========================================
  # Clock & Date
  # ===========================================
  clocks:
    type: clocks
    enabled: true
    position:
      top: 2
      left: 0
      height: 1
      width: 1
    title: " Time"
    locations:
      Local: "Local"
    sort: "alphabetical"
    dateFormat: "Monday, Jan 02"
    timeFormat: "15:04"

  # ===========================================
  # Resource Usage
  # ===========================================
  resourceusage:
    type: resourceusage
    enabled: true
    position:
      top: 2
      left: 1
      height: 1
      width: 2
    title: " Resources"
    cpuCombined: true
    showCPU: true
    showMem: true
    showSwp: false
    refreshInterval: 5s
