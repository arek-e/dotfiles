wtf:
  colors:
    background: "transparent"
    border:
      focusable: "#7aa2f7"
      focused: "#bb9af7"
      normal: "#3b4261"
    checked: "#9ece6a"
    highlight:
      fore: "#1a1b26"
      back: "#7aa2f7"
    text: "#c0caf5"
    title: "#7dcfff"
  grid:
    columns: [40, 40, 40]
    rows: [12, 12, 6]
  refreshInterval: 30
  openFileUtil: "open"
  term: "xterm-256color"
  mods:
    github_prs:
      title: " My PRs"
      type: cmdrunner
      enabled: true
      position:
        top: 0
        left: 0
        height: 1
        width: 1
      refreshInterval: 300
      cmd: "gh"
      args: ["pr", "list", "--author", "@me", "--state", "open", "--limit", "8"]

    github_issues_created:
      title: " Issues I Created"
      type: cmdrunner
      enabled: true
      position:
        top: 0
        left: 1
        height: 1
        width: 1
      refreshInterval: 300
      cmd: "gh"
      args: ["issue", "list", "--author", "@me", "--state", "open", "--limit", "8"]

    github_issues_assigned:
      title: " Issues Assigned"
      type: cmdrunner
      enabled: true
      position:
        top: 0
        left: 2
        height: 1
        width: 1
      refreshInterval: 300
      cmd: "gh"
      args: ["issue", "list", "--assignee", "@me", "--state", "open", "--limit", "8"]

    linear_tasks:
      title: " Linear Issues"
      type: cmdrunner
      enabled: true
      position:
        top: 1
        left: 0
        height: 1
        width: 2
      refreshInterval: 300
      cmd: "npx"
      args: ["@schpet/linear-cli", "list", "--limit", "10"]

    github_prs_review:
      title: " PRs to Review"
      type: cmdrunner
      enabled: true
      position:
        top: 1
        left: 2
        height: 1
        width: 1
      refreshInterval: 300
      cmd: "gh"
      args: ["pr", "list", "--search", "is:open review-requested:@me", "--limit", "8"]

    clocks:
      title: " Time"
      type: clocks
      enabled: true
      position:
        top: 2
        left: 0
        height: 1
        width: 1
      locations:
        Local: "Local"
      sort: "alphabetical"
      dateFormat: "Monday, Jan 02"
      timeFormat: "15:04"

    resourceusage:
      title: " Resources"
      type: resourceusage
      enabled: true
      position:
        top: 2
        left: 1
        height: 1
        width: 2
      cpuCombined: true
      showCPU: true
      showMem: true
      showSwp: false
      refreshInterval: 5
