# version: 1.1.0
# Tokyo Night Color Theme with Nerd Font Icons

add_newline = true
continuation_prompt = "[ ](dimmed white)"

# Tokyo Night Palette Reference:
# Red: #f7768e | Green: #9ece6a | Yellow: #e0af68
# Blue: #7aa2f7 | Magenta: #bb9af7 | Cyan: #7dcfff
# Foreground: #c0caf5 | Comment: #565f89

format = """($nix_shell$container$fill$git_metrics\n)$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$character"""

right_format = """
$singularity\
$kubernetes\
$docker_context\
${custom.sep_infra}\
$directory\
${custom.sep_git}\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
${custom.sep_lang}\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$vlang\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
${custom.sep_cloud}\
$terraform\
$vagrant\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$memory_usage\
$custom\
$status\
$os\
${custom.sep_battery}\
$battery"""

[fill]
symbol = ' '

# ═══════════════════════════════════════════════════════════════════════════════
# PROMPT CHARACTER
# ═══════════════════════════════════════════════════════════════════════════════
[character]
format = "$symbol "
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[](bold #7aa2f7)"
vimcmd_replace_one_symbol = "[](bold #bb9af7)"
vimcmd_replace_symbol = "[](bold #bb9af7)"
vimcmd_visual_symbol = "[󰒉](bold #e0af68)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

# ═══════════════════════════════════════════════════════════════════════════════
# USER & SYSTEM
# ═══════════════════════════════════════════════════════════════════════════════
[sudo]
format = "[$symbol]($style) "
style = "bold #bb9af7"
symbol = ""
disabled = false

[username]
style_user = "bold #e0af68"
style_root = "bold #f7768e"
format = "[ $user]($style) "
disabled = false
show_always = false

[hostname]
format = "[󰒋 $hostname]($style) "
style = "bold #7dcfff"
ssh_only = true

[localip]
ssh_only = true
format = "[󰛳 $localipv4]($style) "
style = "bold #bb9af7"
disabled = false

[jobs]
format = "[ $number]($style) "
style = "#7aa2f7"
number_threshold = 1
symbol_threshold = 1

[cmd_duration]
format = "[ $duration]($style) "
style = "italic #565f89"
min_time = 2000

# ═══════════════════════════════════════════════════════════════════════════════
# DIRECTORY
# ═══════════════════════════════════════════════════════════════════════════════
[directory]
home_symbol = " ~"
truncation_length = 2
truncation_symbol = "…/"
read_only = " "
use_os_path_sep = true
style = "#7aa2f7"
read_only_style = "#f7768e"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold #7aa2f7'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [](bold #9ece6a)'

# ═══════════════════════════════════════════════════════════════════════════════
# GIT
# ═══════════════════════════════════════════════════════════════════════════════
[git_branch]
format = "[$symbol $branch(:$remote_branch)]($style)"
symbol = ""
style = "#9ece6a"
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'
added_style = '#9ece6a'
deleted_style = '#f7768e'
ignore_submodules = true
disabled = false

[git_status]
style = "#7aa2f7"
format = '([$all_status$ahead_behind]($style))'
conflicted = " 󰞇"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " "
stashed = " "
modified = " "
staged = " [+${count}](#9ece6a)"
renamed = " 󰑕"
deleted = " "

# ═══════════════════════════════════════════════════════════════════════════════
# TIME & BATTERY (time disabled - macOS shows it)
# ═══════════════════════════════════════════════════════════════════════════════
[time]
disabled = true

[battery]
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 20
style = "bold #f7768e"

[[battery.display]]
threshold = 50
style = "#e0af68"

[[battery.display]]
threshold = 80
style = "#565f89"

# ═══════════════════════════════════════════════════════════════════════════════
# LANGUAGES & TOOLS - Nerd Font Icons
# ═══════════════════════════════════════════════════════════════════════════════
[nodejs]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#9ece6a"
detect_files = ["package-lock.json", "yarn.lock", "package.json"]
detect_folders = ["node_modules"]
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]

[python]
format = "[ $version( $virtualenv)]($style) "
version_format = "${raw}"
style = "#e0af68"
symbol = ""

[rust]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#f7768e"
symbol = ""

[golang]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#7dcfff"
symbol = ""

[ruby]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#f7768e"
symbol = ""

[lua]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#7aa2f7"
symbol = ""

[swift]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#f7768e"
symbol = ""

[java]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#f7768e"
symbol = ""

[kotlin]
format = "[ $version]($style) "
version_format = "${raw}"
style = "#bb9af7"
symbol = ""

[deno]
format = "[🦕 $version]($style) "
version_format = "${raw}"
style = "#9ece6a"

[c]
format = "[ $version]($style) "
symbol = ""
style = "#7aa2f7"

[cpp]
format = "[ $version]($style) "
symbol = ""
style = "#7aa2f7"

[dart]
format = "[ $version]($style) "
symbol = ""
style = "#7dcfff"

[elixir]
format = "[ $version]($style) "
symbol = ""
style = "#bb9af7"

[elm]
format = "[ $version]($style) "
symbol = ""
style = "#7dcfff"

[haskell]
format = "[ $version]($style) "
symbol = ""
style = "#bb9af7"

[julia]
format = "[ $version]($style) "
symbol = ""
style = "#9ece6a"

[nim]
format = "[ $version]($style) "
symbol = ""
style = "#e0af68"

[zig]
format = "[ $version]($style) "
symbol = ""
style = "#e0af68"

[scala]
format = "[ $version]($style) "
symbol = ""
style = "#f7768e"

[perl]
format = "[ $version]($style) "
symbol = ""
style = "#7aa2f7"

[php]
format = "[ $version]($style) "
symbol = ""
style = "#bb9af7"

# ═══════════════════════════════════════════════════════════════════════════════
# PACKAGE MANAGERS & CONTAINERS
# ═══════════════════════════════════════════════════════════════════════════════
[package]
format = "[󰏗 $version]($style) "
version_format = "${raw}"
style = "#e0af68"
symbol = "󰏗"

[docker_context]
format = "[ $context]($style) "
symbol = ""
style = "#7dcfff"

[conda]
format = "[ $environment]($style) "
symbol = ""
style = "#9ece6a"

[pixi]
format = "[󰏗 $environment]($style) "
symbol = "󰏗"
style = "#9ece6a"

[buf]
format = "[󰿘 $version]($style) "
symbol = "󰿘"
style = "#7aa2f7"

# ═══════════════════════════════════════════════════════════════════════════════
# CLOUD & INFRASTRUCTURE
# ═══════════════════════════════════════════════════════════════════════════════
[aws]
disabled = true
format = "[ $profile($region)]($style) "
style = "#e0af68"
symbol = ""

[gcloud]
format = "[ $project]($style) "
style = "#7aa2f7"
symbol = ""

[azure]
format = "[󰠅 $subscription]($style) "
style = "#7aa2f7"
symbol = "󰠅"

[kubernetes]
format = "[󱃾 $context( $namespace)]($style) "
style = "#7aa2f7"
symbol = "󱃾"
disabled = false

[terraform]
format = "[󱁢 $workspace]($style) "
style = "#bb9af7"
symbol = "󱁢"

[vagrant]
format = "[ $version]($style) "
style = "#7aa2f7"
symbol = ""

[helm]
format = "[󰠳 $version]($style) "
style = "#7aa2f7"
symbol = "󰠳"

# ═══════════════════════════════════════════════════════════════════════════════
# NIX & SYSTEM
# ═══════════════════════════════════════════════════════════════════════════════
[nix_shell]
format = '[ $state( $name)]($style) '
symbol = ''
style = '#7dcfff'
impure_msg = 'impure'
pure_msg = 'pure'
unknown_msg = ''

[memory_usage]
format = "[󰍛 ${ram}]($style) "
symbol = "󰍛"
style = "#565f89"
threshold = 75
disabled = true

[spack]
format = "[󰏗 $environment]($style) "
symbol = "󰏗"
style = "#bb9af7"

# ═══════════════════════════════════════════════════════════════════════════════
# SEPARATORS - Subtle dividers between status line sections
# ═══════════════════════════════════════════════════════════════════════════════
[custom.sep_infra]
description = "Separator after infra (k8s/docker)"
command = "echo │"
when = "[ -f docker-compose.yml ] || [ -f Dockerfile ] || kubectl config current-context 2>/dev/null | grep -q ."
style = "#3b4261"
format = "[$output]($style) "

[custom.sep_git]
description = "Separator before git"
command = "echo │"
when = "git rev-parse --git-dir 2>/dev/null"
style = "#3b4261"
format = "[$output]($style) "

[custom.sep_lang]
description = "Separator before languages"
command = "echo │"
when = "[ -f package.json ] || [ -f Cargo.toml ] || [ -f go.mod ] || [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f Gemfile ] || [ -f *.lua ] 2>/dev/null || [ -f Package.swift ]"
style = "#3b4261"
format = "[$output]($style) "

[custom.sep_cloud]
description = "Separator before cloud/terraform"
command = "echo │"
when = "[ -f main.tf ] || [ -f *.tf ] 2>/dev/null || [ -f Vagrantfile ]"
style = "#3b4261"
format = "[$output]($style) "

[custom.sep_battery]
description = "Separator before battery"
command = "echo │"
when = "command -v pmset >/dev/null 2>&1"
style = "#3b4261"
format = "[$output]($style) "
